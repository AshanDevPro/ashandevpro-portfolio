name: Deploy AshanDevPro to Namecheap

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ashandevpro-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Package website
        run: tar -czf site.tar.gz -C dist .

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.NC_SSH_PRIVATE_KEY }}
          SSH_HOSTS: ${{ secrets.NC_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Upload website to Namecheap
        env:
          NC_HOST: ${{ secrets.NC_HOST }}
          NC_USER: ${{ secrets.NC_USER }}
        run: |
          set -euo pipefail

          scp -P 21098 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -i "$HOME/.ssh/deploy_key" \
            site.tar.gz \
            "$NC_USER@$NC_HOST:ashandevpro_site.tar.gz"

          ssh -p 21098 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -i "$HOME/.ssh/deploy_key" \
            "$NC_USER@$NC_HOST" \
            'set -e; test -d "$HOME/public_html"; tar -xzf "$HOME/ashandevpro_site.tar.gz" -C "$HOME/public_html"; rm "$HOME/ashandevpro_site.tar.gz"'

      - name: Deployment complete
        run: echo "Website uploaded to Namecheap successfully"
