name: Deploy AshanDevPro to Namecheap

# Manual deployment first
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ashandevpro-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout website code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build React website
        run: npm run build

      - name: Prepare website archive
        run: |
          set -euo pipefail

          test -s dist/index.html

          # Preserve existing server .htaccess and demos
          tar -czf ashandevpro-site.tar.gz \
            --exclude='./.htaccess' \
            --exclude='./demos' \
            -C dist .

      - name: Configure secure SSH
        env:
          SSH_KEY: ${{ secrets.NC_SSH_PRIVATE_KEY }}
          SSH_HOSTS: ${{ secrets.NC_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"

          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_HOSTS" > "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Verify Namecheap destination
        env:
          NC_HOST: ${{ secrets.NC_HOST }}
          NC_USER: ${{ secrets.NC_USER }}
        run: |
          ssh \
            -p 21098 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -i "$HOME/.ssh/deploy_key" \
            "$NC_USER@$NC_HOST" \
            'test -d "$HOME/public_html" &&
             test -w "$HOME/public_html" &&
             echo "Namecheap destination verified"'

      - name: Transfer website to Namecheap
        env:
          NC_HOST: ${{ secrets.NC_HOST }}
          NC_USER: ${{ secrets.NC_USER }}
        run: |
          set -euo pipefail

          scp \
            -P 21098 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -i "$HOME/.ssh/deploy_key" \
            ashandevpro-site.tar.gz \
            "$NC_USER@$NC_HOST:ashandevpro-site.tar.gz"

      - name: Publish website to public_html
        env:
          NC_HOST: ${{ secrets.NC_HOST }}
          NC_USER: ${{ secrets.NC_USER }}
        run: |
          set -euo pipefail

          ssh \
            -p 21098 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -i "$HOME/.ssh/deploy_key" \
            "$NC_USER@$NC_HOST" \
            'set -eu
             archive="$HOME/ashandevpro-site.tar.gz"
             trap '\''rm -f "$archive"'\'' EXIT
             test -f "$archive"
             test -d "$HOME/public_html"
             tar -xzf "$archive" -C "$HOME/public_html"
             test -s "$HOME/public_html/index.html"
             echo "Website files deployed successfully"'

      - name: Deployment finished
        run: echo "AshanDevPro deployment completed"
